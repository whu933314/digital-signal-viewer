[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotkit"
version = "0.2.0"
description = "像 pyplot 一樣用的互動繪圖套件（tkinter + numpy + matplotlib）：點選、改樣式、資料提示、縮放平移、標註、Undo、JSON 存讀、跨視窗複製貼上"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["plotkit"]
